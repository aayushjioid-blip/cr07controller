name: Build Cricket 07 HID Controller APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug and Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug assembleRelease --stacktrace
          
          mkdir -p dist
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} dist/Cricket07Controller-v2.3.0-release.apk \;
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} dist/Cricket07Controller-v2.3.0-debug.apk \;
          ls -la dist/

      - name: Upload Versioned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Cricket07Controller-v2.3.0-Release-APK
          path: dist/Cricket07Controller-v2.3.0-release.apk

      - name: Upload Versioned Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cricket07Controller-v2.3.0-Debug-APK
          path: dist/Cricket07Controller-v2.3.0-debug.apk
